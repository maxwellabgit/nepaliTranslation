# Supabase Scheduled Functions descriptor for process-scheduled-jobs.
#
# Boundary (see docs/OPERATIONS.md):
#   * The endpoint owns deletion only: storage, database, then Auth
#     for historical full-identity requests. Shared-data deletion keeps Auth.
#   * No contribution reward close, review rotation or lookahead runs.
#   * Idempotent stages and every-minute retry enforce the deletion deadline.
#
# Auth: CRON_SECRET bearer (or service role) — see docs/OPERATIONS.md
# secret matrix. This file is a template; the human must import it into
# Supabase Scheduled Functions (or replace with the chosen scheduler
# provider) and paste the resulting dashboard link into
# docs/OPERATIONS.md verification checklist.

name: process-scheduled-jobs
schedule: "* * * * *"
timezone: UTC
retries: 0
description: |
  Hosted scheduler template: retry shared-data and historical identity
  deletion. No contribution reward or review rotation is part of this job.

request:
  method: POST
  path: /functions/v1/process-scheduled-jobs
  headers:
    Content-Type: application/json
    Authorization: Bearer ${CRON_SECRET}
  body: |
    {}

alerts:
  # Set these in your alert routing (docs/OPERATIONS.md).
  on_failure:
    - name: v1-ops-oncall
      threshold: any-failure
    - name: v1-scheduler-miss
      description: page after 2 consecutive missed minute-by-minute deletion worker runs
