[package]
name = "neptranslate-testing-ground"
version = "0.1.0"
description = "Engineering-only Windows testing ground for NepTranslate Expo web"
authors = ["NepTranslate"]
edition = "2021"

[lib]
name = "neptranslate_testing_ground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
