# Device smoke for NepTranslate (Expo iOS).
# Requires a development build and the Maestro CLI.
# Run: maestro test .maestro/smoke_tabs.yaml
appId: com.neptranslate.app
---
- launchApp
- assertVisible:
    id: "app-shell"
- assertVisible:
    id: "tab-bar"
- assertVisible:
    id: "tab-translate"
- assertVisible:
    id: "pane-translate"
- assertVisible: "Speak"
- tapOn:
    id: "tab-camera"
- assertVisible:
    id: "pane-camera"
- tapOn:
    id: "tab-learn"
- assertVisible:
    id: "pane-learn"
- assertVisible: "Earn rewards"
- tapOn:
    id: "tab-translate"
- assertVisible:
    id: "pane-translate"
- assertNotVisible: "Conversation"
