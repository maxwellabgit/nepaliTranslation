name: backend-gate

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/beta-*"
      - "cursor/v1-*"

jobs:
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start local Supabase
        run: supabase start
      - name: Reset database
        run: supabase db reset
      - name: Lint database
        run: supabase db lint --level error
      - name: pgTAP
        run: supabase test db
      - name: Edge function unit tests
        run: deno test --allow-env supabase/functions/_shared supabase/functions/tests
      - name: Concurrent reward grant
        run: bash supabase/scripts/concurrent_reward.sh
      - name: Reset pre-fix schema for upgrade proof
        run: supabase db reset --version 20260923220000
      - name: Apply forward migrations
        run: supabase migration up --local
      - name: pgTAP on clean upgraded schema
        run: supabase test db
      - name: Reset pre-fix schema for data-preservation proof
        run: supabase db reset --version 20260923220000
      - name: Seed pre-fix state
        run: node scripts/prove_upgrade_path.mjs --seed
      - name: Apply forward migrations to existing rows
        run: supabase migration up --local
      - name: Assert pre-fix rows survived the upgrade
        run: node scripts/prove_upgrade_path.mjs --assert

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
